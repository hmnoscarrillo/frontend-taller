name: Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install
        run: |
          if (Test-Path package.json) { npm ci --silent } else { Write-Output "No package.json - skipping npm install" }

      - name: Build
        run: |
          if (Test-Path package.json) { npm run build --if-present } else { Write-Output "No package.json - skipping build" }

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel --prod --token "$VERCEL_TOKEN" --confirm
